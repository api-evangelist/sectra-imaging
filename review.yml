  - url: https://github.com/fhircast
    type: SourceCode
    note: Open-source FHIRcast sandbox and reference implementation (community/standard tooling).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public WebSocket surface exists on any Sectra-owned open API, and Sectra
    does not run a public self-service developer API at all. The entry is an
    honest gated stub: logical APIs are modeled from Sectra's documented
    healthcare-standard interfaces (DICOMweb, HL7, XDS, FHIRcast, Web Content
    API) plus the Amplifier Marketplace integration program, with endpoint
    detail marked endpointsModeled rather than fabricated. No AsyncAPI document
    was created because there is no documented Sectra-hosted server-push
    transport to model.
